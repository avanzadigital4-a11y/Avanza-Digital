# Alembic — configuración para avanza-portal.
#
# INERTE hasta que corras `alembic ...`. No se importa ni ejecuta en el arranque
# de la app: el sistema de migraciones vigente sigue siendo el de main.py
# (_aplicar_migracion) + check_migraciones.py. Ver migrations/README_ALEMBIC.md
# para el plan de adopción cuando el esquema se estabilice.
#
# La URL de la base NO se pone acá: la resuelve migrations/env.py leyendo
# DATABASE_URL del entorno y aplicando el fix postgres:// → postgresql://,
# exactamente como database.py. Así local (SQLite) y prod (Render Postgres)
# funcionan sin tocar este archivo.

[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url se setea en env.py (dejar vacío a propósito)
sqlalchemy.url =

[post_write_hooks]
# (opcional) formateo automático de las migraciones generadas

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
